name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, such as 0.1.0. Leave empty to use src-tauri/tauri.conf.json. The tag is v plus that version."
        required: false
        default: ""
        type: string

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          # inputs is unset on a tag push and fails the workflow if referenced there.
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
        run: |
          $raw = node scripts/resolve-release-tag.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $json = $raw.Trim() | ConvertFrom-Json
          "tag=$($json.tag)" >> $env:GITHUB_OUTPUT
          "name=Markdown Editor $($json.tag)" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: npm ci

      - name: Build unsigned Windows installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag pushes and manual runs both publish a Release. An empty tagName skips it.
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: ${{ steps.release.outputs.name }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Unsigned Windows builds for Markdown Editor.

            - NSIS setup (`.exe`) and WiX installer (`.msi`) install the app.
            - `*-portable.zip` does not install anything. Unzip it and run `markdown-editor.exe`.

            These files are not code-signed. Windows SmartScreen may warn until a certificate is added.
            The portable zip does not install WebView2. Windows 11 already includes that runtime.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Package portable Windows zip
        id: portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $zip = node scripts/package-windows-portable.mjs
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace([string]$zip)) {
            throw "Portable zip was not created (node exit code $LASTEXITCODE)."
          }
          $zip = ([string]$zip).Trim()
          if (-not (Test-Path -LiteralPath $zip)) { throw "Portable zip was not created: $zip" }
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: ${{ steps.portable.outputs.zip }}
          if-no-files-found: error

      - name: Attach portable zip to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "${{ steps.release.outputs.tag }}" "${{ steps.portable.outputs.zip }}" --clobber
